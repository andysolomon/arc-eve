  - id: "3.1"
    kind: leaf
    title: "#13 Add an end-to-end provider-backed Eve acceptance test"
    parent_id: "3.0"
    nesting_depth: 1
    outcome: A repeatable opt-in manual acceptance run proves the real
      provider-backed path from Eve parent authentication through an
      approved read-capable arc_delegate delegation, with manual
      pass/fail evidence and automated coverage kept offline.
    scope: Documented operator prerequisites for parent-provider auth and
      one authenticated worker CLI; disposable real checkout running eve
      dev with parent auth plus one approved read-capable arc_delegate
      request via the real arc-orchestrator; full-path verification
      (model turn, operator gate, runner invocation, worker auth, bounded
      evidence, host checkout, session-runs record); negative paths for
      missing parent credentials, missing CLI, unauthenticated worker,
      cancellation, and timeout kept generic and fail-closed; manual
      evidence and go/no-go record. Automated tests stay fake/offline and
      credentialed runs stay out of CI.
    acceptance_criteria:
      - Documented manual run completes a real provider-backed
        read-capable delegation against a throwaway checkout
      - No API key, login URL/device code, account identity, raw provider
        output, prompt, or transcript appears in history, tool results,
        session-runs, traces, or repository files
      - Run proves provider authentication and delegation use the same
        configured worker binary
      - Failure at either auth boundary identifies the boundary without
        sensitive detail and leaves ARC Pi as the daily harness
      - Automated tests remain offline; manual-only credentialed test is
        clearly marked and excluded from CI
    dependencies:
      - "1.1"
      - "2.1"
      - "2.2"
      - "2.3"
    preserved_behavior: ARC Pi remains the default daily harness until the
      real provider-backed test passes; arc-orchestrator and
      runner-routing-v4 remain unchanged as the worker plane.
    checkpoint:
      state: completed
      updated_at: 2026-09-14T17:21:00.000Z
      evidence_ref: https://github.com/andysolomon/arc-eve/issues/13
      notes: "Shipped: scripts/e2e-acceptance.ts as the host-only CLI with
        --check/--run and --mode=fake|real; --mode=real requires --confirm-
        real and is rejected in CI even with ARC_E2E_FORCE=1; fake mode
        copies the repo into a throwaway temp checkout, runs an Explore-
        scoped arc_delegate against a fake runner, captures the registry
        record, and writes bounded redacted evidence. docs/architecture/
        e2e-acceptance.md covers operator prerequisites, env-var
        conventions, redaction list (API key, device URL, account
        identifier, prompt, transcript, session-runs), pass/fail checks,
        and an explicit CI exclusion note. test/e2e-acceptance.test.ts (6
        tests) covers arg surface, four-state --check, bounded fake run
        evidence, full redaction across 4 sensitive markers, CI exclusion
        even under ARC_E2E_FORCE=1, and same-workflow-binary alignment
        with provider-auth for the same env. test/arc-delegate-approval
        test.ts gained one additive assertion proving Explore against the
        harness fake checkout deep-equals compactResult. README.md
        references the new doc. pnpm typecheck clean; full suite 66
        tests green across 9 files. Real-mode manual run remains
        operator-initiated per the runbook; ARC Pi is the daily harness."
      evidence_ref: https://github.com/andysolomon/arc-eve/issues/13
