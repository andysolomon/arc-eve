  - id: "2.1"
    kind: leaf
    title: "#12 Share ARC Pi worker binary resolution with ARC runner"
    parent_id: "2.0"
    nesting_depth: 1
    outcome: Eve login, status, and arc_delegate resolve the same worker
      executable through one shared resolver matching ARC Pi and runner
      precedence, including PATH defaults and fail-closed invalid paths.
    scope: One shared resolver used by provider login, provider status, and
      ARC worker execution; canonical ARC_ORCHESTRATOR_*_BIN precedence with
      compatibility aliases as documented fallbacks; PATH resolution of
      cursor-agent and claude; fail-closed invalid explicit paths;
      normalized child environment and diagnostics. No startup vendor probing
      or credential inspection.
    acceptance_criteria:
      - Canonical ARC_ORCHESTRATOR_*_BIN values win over aliases and defaults
      - Compatibility aliases work only when the canonical value is absent
      - Default cursor-agent and claude commands work from PATH with no
        override set
      - Invalid explicit paths give a clear generic missing/unavailable
        result and never fall through to another binary
      - Login, status, and arc_delegate resolve the same selected executable
      - Tests cover canonical/alias/default precedence, PATH lookup,
        invalid paths, and the child environment
    dependencies:
      - "1.1"
    preserved_behavior: The external arc-orchestrator remains the worker
      plane with its own routing, sandbox, locking, and authentication
      responsibilities.
    checkpoint:
      state: completed
      updated_at: 2026-09-14T16:30:00.000Z
      evidence_ref: https://github.com/andysolomon/arc-eve/issues/12
      notes: "Shipped: agent/lib/worker-binaries.ts gains resolveWorkerBinaries,
        resolveWorkerBinary (missing|invalid|unavailable), findExecutableInPath
        (bare-name PATH lookup with X_OK gate) while configuredWorkerBinaries
        keeps env-only semantics. agent/lib/arc-auth.ts now consumes the new
        resolver so providerStatus and providerLogin share identity with
        arc_delegate. agent/lib/arc-runtime.ts exposes resolvedWorkerBinaries,
        resolvedWorkerBinary, resolvedWorkerChildEnv, workerBinaryRegistryMeta;
        discoverRunner is unchanged. agent/tools/arc_delegate.ts records
        workerBinaryAliases + workerBinaryPresent in the registry (alias names
        + booleans only, never paths or credentials). test/worker-binaries.test.ts
        (4 tests) covers canonical > alias > PATH > fail-closed for both kinds;
        arc-auth.test.ts keeps all original tests unchanged plus one additive
        PATH-only fake-binary discovery test. pnpm typecheck clean; full suite
        (46 tests) green across 7 files; scripts/provider-auth.ts public argv
        unchanged."
      evidence_ref: https://github.com/andysolomon/arc-eve/issues/12
  - id: "2.2"
    kind: leaf
    title: "#10 Provide an operator-only worker login/status surface in Eve"
    parent_id: "2.0"
    nesting_depth: 1
    outcome: Operators can initiate Cursor Agent and Claude Code login and
      query redacted status from the documented Eve operator surface, while
      the model can neither discover nor invoke login/status.
    scope: Operator-only login/status entry point reachable from the primary
      Eve workflow or a first-class companion host command with a documented
      relationship to eve dev; explicit Cursor Agent and Claude Code
      selection plus one-or-both status; same configured worker executable
      as delegation; four-state status projection; documented
      install/login/status/vendor-logout paths. Exclude vendor CLI
      installation, account management, credential migration, and /model
      picker registration. Do not treat always() approval on a
      model-callable tool as an operator-only boundary.
    acceptance_criteria:
      - Operator can initiate Cursor Agent login and Claude Code login from
        the documented surface
      - Operator can query either provider or both and receives only
        missing, authenticated, unauthenticated, or unknown
      - Model cannot discover or invoke login/status as a tool, directly or
        through an authorization parameter
      - Missing CLI and unauthenticated CLI give distinct, actionable,
        redacted outcomes
      - Flow uses the worker executable identity from the shared binary
        configuration
      - Tests prove the operator boundary and generic output without real
        paid login or real credential state
    dependencies:
      - "2.1"
    preserved_behavior: Cursor Agent and Claude Code remain
      subscription-backed ARC workers, not Eve model providers; official
      CLIs own authentication, persistence, and logout.
    checkpoint:
      state: completed
      updated_at: 2026-09-14T16:39:00.000Z
      evidence_ref: https://github.com/andysolomon/arc-eve/issues/10
      notes: "Shipped: scripts/provider-auth.ts gains additive kind both for
        status|login; per-kind {provider,status} JSON unchanged; both emits
        one JSON line per kind (cursor-agent first, claude-code second);
        exit code is the union of per-kind rules (1 if any kind fails).
        README.md v1 operator-surface paragraph pins the entry point and
        lists cursor-agent|claude-code|both. test/provider-auth.test.ts
        grew from 3 to 8 tests: four-state projection per kind (Set size
        check), both-kind status/login leak-free output, exit-code union
        (bothOk=0, mixed=1 with partial stdout, bothFail=1 with empty
        stdout), agent/tools guard (no provider-auth/providerLogin/
        providerStatus/arc-auth imports and no arc_login.ts or
        arc-auth-status.ts file), and a defineTool negative check.
        pnpm typecheck clean; full suite 51 tests green across 7 files.
        Documented follow-up: docs/architecture/operator-surface.md still
        shows pre-both command examples (left untouched per scope); can be
        refreshed in a docs leaf."
      evidence_ref: https://github.com/andysolomon/arc-eve/issues/10
  - id: "2.3"
    kind: leaf
    title: "#11 Match ARC Pi provider login lifecycle and secrecy guarantees"
    parent_id: "2.0"
    nesting_depth: 1
    outcome: Worker login/status matches ARC Pi lifecycle and secrecy -
      bounded transient output cleared after the operation, operator
      cancellation and deadlines enforced, vendor browser flow handled
      without uncontrolled browser launch, API-key path supported, and a
      post-login status probe projects to four generic states.
    scope: Exact vendor argv with shell false and independent bounded
      stdout/stderr capture; transient operator-visible output cleared on
      completion and never persisted to history, prompts, session records,
      or traces; SIGTERM then bounded SIGKILL cancellation, bounded
      configurable deadlines, waiting heartbeats; Cursor browser/device
      flow URL detection with operator guidance and CURSOR_API_KEY path
      without logging the key; explicit post-login status probe;
      conservative unknown handling.
    acceptance_criteria:
      - Login instructions, URLs, device codes, account identifiers, and raw
        provider output exist only in bounded transient UI/process memory
        and are cleared after the operation
      - Cancellation and timeout terminate a stalled provider process
        within the configured bound and return a generic result
      - Successful login is followed by a status probe; failure, missing
        CLI, timeout, cancellation, and unknown stay distinguishable
        without leaking provider details
      - Cursor API-key authentication skips browser login with generic-only
        status; the key never appears in output, history, or traces
      - Tests use fake executables to cover output bounds, cancellation,
        timeout, browser URL handling, post-login status, and redaction
    dependencies:
      - "2.1"
    preserved_behavior: Vendor CLIs remain the authentication authority;
      Eve does not read, copy, refresh, persist, or display credential
      material, and authentication stays operator-initiated only.
    checkpoint:
      state: completed
      updated_at: 2026-09-14T16:45:30.000Z
      evidence_ref: https://github.com/andysolomon/arc-eve/issues/11
      notes: "Shipped: agent/lib/arc-auth.ts now uses resolveWorkerBinary
        (leaf 2.1), so login/status and arc_delegate share the same
        resolver. Public argv unchanged (cursor-agent login; claude-code
        auth login) with shell: false. Added ProviderLoginResult type
        (status, postLoginStatus, credentialSource, browserGuidance),
        CURSOR_API_KEY skip-login (only credentialSource constant exposed,
        never the key), AbortSignal-driven SIGTERM->SIGKILL escalation
        with configurable deadline, browser URL detection redacted to
        scheme://host only (no path, no query), captured stdout/stderr
        discarded once classify resolves. After the composer-2.5 Code
        Review (verdict: 2.2 PASS, 2.3 FAIL on the post-login probe
        contract gap), the success-after-binary-login path now
        actually spawns providerStatus post-login (not classifyCaptured
        on login stdout); blockedLogin returns {status: blocked,
        postLoginStatus: unknown}; the legacy argv-recording and
        timeout tests got additive updates to reflect the probe. Full
        suite 59 tests green across 8 files; pnpm typecheck clean."
      evidence_ref: https://github.com/andysolomon/arc-eve/issues/11
